<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTEC Admin Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#141d2e',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Glassmorphism utilities */
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    .glow-text {
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    /* Custom Scrollbar for the terminal window */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent; 
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1); 
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2); 
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans selection:bg-blue-500/30 overflow-hidden flex flex-col">

  <!-- Header -->
  <header class="glass-panel sticky top-0 z-50 border-b border-slate-800/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i data-lucide="server" class="text-white w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-white tracking-tight">OTEC LAN Server</h1>
            <p class="text-[10px] text-emerald-400 font-mono tracking-widest uppercase flex items-center gap-1.5 mt-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              Live Monitoring
            </p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6 h-[calc(100vh-4rem)]">
    
    <!-- Top Metrics Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 shrink-0">
      
      <!-- Metric: Uptime -->
      <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
        <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-110"></div>
        <div class="flex justify-between items-start">
          <div>
            <p class="text-sm font-medium text-slate-400 mb-1">Server Uptime</p>
            <h3 class="text-3xl font-bold text-white glow-text font-mono" id="val-uptime">00:00:00</h3>
          </div>
          <div class="p-2.5 bg-blue-500/10 rounded-xl border border-blue-500/20">
            <i data-lucide="clock" class="text-blue-400 w-5 h-5"></i>
          </div>
        </div>
      </div>

      <!-- Metric: Schools -->
      <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-110"></div>
        <div class="flex justify-between items-start">
          <div>
            <p class="text-sm font-medium text-slate-400 mb-1">Registered Schools</p>
            <h3 class="text-3xl font-bold text-white font-mono" id="val-schools">0</h3>
          </div>
          <div class="p-2.5 bg-indigo-500/10 rounded-xl border border-indigo-500/20">
            <i data-lucide="building-2" class="text-indigo-400 w-5 h-5"></i>
          </div>
        </div>
      </div>

      <!-- Metric: Sync Events -->
      <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
        <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-110"></div>
        <div class="flex justify-between items-start">
          <div>
            <p class="text-sm font-medium text-slate-400 mb-1">Network Activity</p>
            <h3 class="text-3xl font-bold text-white font-mono" id="val-activity">Idle</h3>
          </div>
          <div class="p-2.5 bg-emerald-500/10 rounded-xl border border-emerald-500/20">
            <i data-lucide="activity" class="text-emerald-400 w-5 h-5"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Terminal Feed -->
    <div class="glass-panel rounded-2xl flex-1 flex flex-col overflow-hidden border border-slate-700/50 relative">
      <!-- Terminal Header -->
      <div class="bg-slate-850 px-4 py-3 flex items-center justify-between border-b border-slate-700/50 shrink-0">
        <div class="flex items-center gap-4">
          <div class="flex gap-1.5">
            <div class="w-3 h-3 rounded-full bg-rose-500/80 border border-rose-500"></div>
            <div class="w-3 h-3 rounded-full bg-amber-500/80 border border-amber-500"></div>
            <div class="w-3 h-3 rounded-full bg-emerald-500/80 border border-emerald-500"></div>
          </div>
          <span class="text-xs font-mono text-slate-500">admin@otec-server:~/logs</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold" id="val-connection">Connecting...</span>
        </div>
      </div>
      
      <!-- Terminal Body -->
      <div class="p-4 flex-1 overflow-y-auto font-mono text-xs sm:text-sm" id="terminal-body">
        <!-- Logs will be injected here -->
      </div>
    </div>

  </main>

  <script>
    // Initialize icons
    lucide.createIcons();

    const uptimeEl = document.getElementById('val-uptime');
    const schoolsEl = document.getElementById('val-schools');
    const activityEl = document.getElementById('val-activity');
    const terminalEl = document.getElementById('terminal-body');
    const connectionEl = document.getElementById('val-connection');

    let knownLogTimestamps = new Set();
    let currentUptimeMs = 0;

    // Helper: Format milliseconds to HH:MM:SS
    function formatUptime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
      const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // Helper: Local clock tick for uptime to feel live between polls
    setInterval(() => {
      if (currentUptimeMs > 0) {
        currentUptimeMs += 1000;
        uptimeEl.textContent = formatUptime(currentUptimeMs);
      }
    }, 1000);

    function getLogColorClass(type) {
      if (type.includes('error')) return 'text-rose-400';
      if (type === 'auth') return 'text-blue-400';
      if (type === 'sync') return 'text-emerald-400';
      return 'text-slate-300';
    }

    async function fetchStats() {
      try {
        const res = await fetch('/api/admin/stats');
        if (!res.ok) throw new Error('Bad response');
        
        const data = await res.json();
        
        // Update top metrics
        currentUptimeMs = data.uptime;
        uptimeEl.textContent = formatUptime(currentUptimeMs);
        schoolsEl.textContent = data.schoolCount;
        
        connectionEl.textContent = 'Connected';
        connectionEl.className = 'text-[10px] uppercase tracking-wider text-emerald-500 font-semibold';

        // Check activity
        if (data.recentLogs && data.recentLogs.length > 0) {
          const latestLogTime = data.recentLogs[0].timestamp;
          if (Date.now() - latestLogTime < 5000) {
            activityEl.textContent = 'Active';
            activityEl.className = 'text-3xl font-bold text-emerald-400 font-mono glow-text';
          } else {
            activityEl.textContent = 'Idle';
            activityEl.className = 'text-3xl font-bold text-slate-300 font-mono';
          }

          // Render new logs
          // Logs come sorted latest first, but we want to append them bottom up
          const reversedLogs = [...data.recentLogs].reverse();
          let addedNew = false;

          reversedLogs.forEach(log => {
            // unique key for log
            const logKey = `${log.timestamp}-${log.type}`;
            if (!knownLogTimestamps.has(logKey)) {
              knownLogTimestamps.add(logKey);
              addedNew = true;
              
              const timeStr = new Date(log.timestamp).toLocaleTimeString();
              const logRow = document.createElement('div');
              logRow.className = 'mb-2 leading-relaxed opacity-0 transition-opacity duration-500 animate-[fadeIn_0.3s_ease-out_forwards]';
              
              const colorClass = getLogColorClass(log.type);
              
              logRow.innerHTML = `
                <span class="text-slate-500">[${timeStr}]</span> 
                <span class="text-slate-400 uppercase w-12 inline-block ml-2">${log.type.split('_')[0]}</span>
                <span class="text-slate-600 mr-2">❯</span>
                <span class="${colorClass}">${log.message}</span>
                ${log.schoolId ? `<span class="text-slate-500 ml-2 text-[10px]">ID: ${log.schoolId.substring(0, 8)}...</span>` : ''}
              `;
              
              terminalEl.appendChild(logRow);
            }
          });

          if (addedNew) {
            terminalEl.scrollTop = terminalEl.scrollHeight;
          }
        }
        
      } catch (e) {
        console.error(e);
        connectionEl.textContent = 'Disconnected';
        connectionEl.className = 'text-[10px] uppercase tracking-wider text-rose-500 font-semibold animate-pulse';
      }
    }

    // Initial fetch and poll every 2 seconds
    fetchStats();
    setInterval(fetchStats, 2000);
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
